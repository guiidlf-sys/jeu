name: TikTok — publication automatique

# Le cron de GitHub Actions ne se déclenche que sur la branche par défaut :
# tant que ce fichier n'est pas fusionné dans `main`, seule l'exécution
# manuelle (workflow_dispatch) fonctionne.
on:
  schedule:
    # 17:00 UTC les lundi, mercredi et vendredi (19h à Paris en été, 18h en hiver).
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      clip:
        description: "Identifiant du clip (vide = le prochain non envoyé)"
        required: false
        type: string
      dry_run:
        description: "Fabriquer la vidéo sans rien envoyer à TikTok"
        required: false
        type: boolean
        default: false
      mode:
        description: "inbox = brouillon TikTok, direct = publication (app auditée requise)"
        required: false
        type: choice
        default: inbox
        options: [inbox, direct]

permissions:
  contents: write

concurrency:
  group: tiktok-publication
  cancel-in-progress: false

defaults:
  run:
    working-directory: tiktok

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tiktok/requirements.txt

      - name: Installer ffmpeg et les polices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Vérifier le plan et l'environnement
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python -m tiktokbot check

      - name: Fabriquer et publier
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_POST_MODE: ${{ inputs.mode || 'inbox' }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          # Facultatif : sans lui, la rotation du refresh token n'est pas
          # enregistrée et l'automatisation s'arrête au bout de quelques envois.
          SECRETS_ADMIN_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          python -m tiktokbot publish \
            ${{ inputs.clip && format('--clip {0}', inputs.clip) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Conserver la vidéo produite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-tiktok
          path: |
            tiktok/out/*.mp4
            tiktok/out/*.caption.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Enregistrer le clip comme envoyé
        if: success() && !inputs.dry_run
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json inchangé, rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "TikTok : journalise le clip publié [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
